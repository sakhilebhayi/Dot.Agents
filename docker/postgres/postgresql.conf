# Dot.Agents — PostgreSQL tuning (docker-compose local/staging use)
#
# Replaces docker/mysql/my.cnf now that docker-compose.yml runs Postgres
# instead of MySQL, matching the real database this whole codebase has
# actually been built and verified against (composer test:pgsql, the CI
# Postgres job, and the Postgres-specific portability fixes documented
# throughout docs/feature-completion-ledger.md).
#
# Only settings with a direct, hardware-independent equivalent to the old
# my.cnf are set explicitly below. MySQL's InnoDB buffer-pool tuning
# (innodb_buffer_pool_size=1G, innodb_buffer_pool_instances=4, etc.) has
# no byte-for-byte Postgres equivalent, and guessing a shared_buffers/
# work_mem/effective_cache_size value without knowing the real target
# host's available RAM would be fabricating a number, not translating
# one -- left at Postgres's own conservative built-in defaults instead.
# Tune shared_buffers (typically ~25% of container memory) and
# effective_cache_size (typically ~50-75%) once real production hardware
# is known.

# Direct equivalent of the old max_connections = 200.
max_connections = 200

# Equivalent intent to slow_query_log=1 / long_query_time=1 (log queries
# taking >= 1000ms), Postgres's built-in slow-query logging mechanism.
log_min_duration_statement = 1000

# Closest analog to innodb_flush_log_at_trx_commit=2 (MySQL's own
# "flush to OS cache every commit, fsync once/sec" durability/throughput
# tradeoff) -- not identical (different WAL/redo-log models entirely),
# but the same class of trade: durability shaved slightly for write
# throughput. Revisit if the durability guarantee this implies (losing
# up to ~200ms of committed transactions on a hard crash) isn't
# acceptable for the real production workload.
synchronous_commit = off

# The official postgres image already initializes databases as UTF8
# by default (POSTGRES_INITDB_ARGS can override this at first init if a
# different encoding/collation is ever needed) -- no equivalent of
# MySQL's character-set-server/collation-server is required here.
