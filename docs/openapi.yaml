openapi: 3.1.0
info:
  title: Dot.Agents API
  version: 2.0.0
  description: |
    Start and follow agent work from another system.

    Sign requests with an API key from Business, API keys. A key belongs to one business and carries abilities:
    `read`, `write`, `run` and `approve`. Keys last 90 days.

    Words that arrive through this API are outside content. They reach an agent as marked data, and a run started
    here needs a person before it changes anything.

    "Deployment" in these paths is what the product calls an agent.
servers:
  - url: /api
security:
  - apiKey: []
paths:
  /hooks/{uuid}:
    post:
      summary: Start work from a signed webhook trigger
      description: Sign `timestamp.body` with HMAC SHA-256 and the trigger's secret. The body may be up to 64 KB and the timestamp must be within five minutes.
      security: []
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
        - { name: X-Dot-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: X-Dot-Signature, in: header, required: true, description: "sha256=<hex>", schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      responses:
        '202': { description: 'Accepted. Returns accepted, id and type (run or workflow).' }
        '401': { description: 'Signature missing, wrong or too old.' }
        '404': { description: No such active trigger. }
        '409': { description: The target refused this work. }
        '413': { description: Body too large. }
  /v1/me:
    get:
      summary: The person the key belongs to
      responses:
        '200': { description: The person. }
  /v1/deployments/{deployment}/runs:
    post:
      summary: Start a run of an agent
      description: Needs the `run` ability. Send `Idempotency-Key` to make a retry safe.
      parameters:
        - { $ref: '#/components/parameters/deployment' }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkInput' }
      responses:
        '202':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '409': { description: 'Refused, for example the agent is paused or the budget is spent.' }
  /v1/runs/{run}:
    get:
      summary: Follow a run
      parameters:
        - { $ref: '#/components/parameters/run' }
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
  /v1/runs/{run}/cancel:
    post:
      summary: Cancel a run
      parameters:
        - { $ref: '#/components/parameters/run' }
      responses:
        '200':
          description: The run after cancelling.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
  /v1/workflows/{workflow}/runs:
    post:
      summary: Start a workflow
      parameters:
        - { name: workflow, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkInput' }
      responses:
        '202':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '409': { description: The workflow cannot start. }
  /v1/workflow-runs/{uuid}:
    get:
      summary: Follow a workflow run
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The workflow run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
  /v1/agents:
    get:
      summary: List the catalogue of agent types
      parameters:
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: department_id, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 50 } }
      responses:
        '200': { description: A page of catalogue rows. }
  /v1/agents/{agent}:
    get:
      summary: One catalogue row
      parameters:
        - { name: agent, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The row. }
        '404': { description: Not found. }
  /v1/deployments:
    get:
      summary: List this business's agents
      responses:
        '200': { description: A page of agents. }
    post:
      summary: Create an agent
      responses:
        '201': { description: Created. }
        '422': { description: Not valid. }
  /v1/deployments/{deployment}:
    get:
      summary: One agent
      parameters:
        - { $ref: '#/components/parameters/deployment' }
      responses:
        '200': { description: The agent. }
    patch:
      summary: Change an agent
      parameters:
        - { $ref: '#/components/parameters/deployment' }
      responses:
        '200': { description: The agent. }
    delete:
      summary: Retire an agent
      parameters:
        - { $ref: '#/components/parameters/deployment' }
      responses:
        '200': { description: Retired. }
  /v1/deployments/{deployment}/pause:
    post:
      summary: Pause an agent
      parameters:
        - { $ref: '#/components/parameters/deployment' }
      responses:
        '200': { description: Paused. }
  /v1/deployments/{deployment}/skills:
    get:
      summary: Custom tools on an agent
      parameters:
        - { $ref: '#/components/parameters/deployment' }
      responses:
        '200': { description: The list. }
    post:
      summary: Put a custom tool on an agent
      parameters:
        - { $ref: '#/components/parameters/deployment' }
      responses:
        '201': { description: Added. }
  /v1/deployments/{deployment}/skills/{skill}:
    patch:
      summary: Turn a custom tool on or off for an agent
      parameters:
        - { $ref: '#/components/parameters/deployment' }
        - { $ref: '#/components/parameters/skill' }
      responses:
        '200': { description: Changed. }
  /v1/deployments/{deployment}/skills/{skill}/execute:
    post:
      summary: Run a custom tool directly
      parameters:
        - { $ref: '#/components/parameters/deployment' }
        - { $ref: '#/components/parameters/skill' }
      responses:
        '200': { description: Finished. }
        '202': { description: Waiting for approval. }
  /v1/deployments/{deployment}/skill-scores:
    get:
      summary: Results of custom tools on an agent
      parameters:
        - { $ref: '#/components/parameters/deployment' }
      responses:
        '200': { description: The results. }
  /v1/skills:
    get:
      summary: List custom tools
      responses:
        '200': { description: The list. }
  /v1/skills/{skill}:
    get:
      summary: One custom tool
      parameters:
        - { $ref: '#/components/parameters/skill' }
      responses:
        '200': { description: The tool. }
  /v1/skill-approvals:
    get:
      summary: List approvals for custom tools
      responses:
        '200': { description: The list. }
  /v1/skill-approvals/{approval}:
    get:
      summary: One approval
      parameters:
        - { $ref: '#/components/parameters/approval' }
      responses:
        '200': { description: The approval. }
  /v1/skill-approvals/{approval}/approve:
    post:
      summary: Approve
      description: Needs the `approve` ability.
      parameters:
        - { $ref: '#/components/parameters/approval' }
      responses:
        '200': { description: Approved. }
  /v1/skill-approvals/{approval}/reject:
    post:
      summary: Reject
      description: Needs the `approve` ability.
      parameters:
        - { $ref: '#/components/parameters/approval' }
      responses:
        '200': { description: Rejected. }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
  parameters:
    deployment: { name: deployment, in: path, required: true, schema: { type: string } }
    run: { name: run, in: path, required: true, schema: { type: string } }
    skill: { name: skill, in: path, required: true, schema: { type: string } }
    approval: { name: approval, in: path, required: true, schema: { type: string } }
  schemas:
    WorkInput:
      type: object
      required: [input]
      properties:
        input: { type: string, maxLength: 20000 }
    Run:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        output: { type: [string, 'null'], description: 'Set only when the run completed.' }
        error: { type: [string, 'null'] }
        steps_used: { type: integer }
        tool_calls_used: { type: integer }
        tokens_used: { type: integer }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    WorkflowRun:
      type: object
      properties:
        id: { type: string }
        status: { type: string, description: 'running, completed, partial or failed' }
        error: { type: [string, 'null'] }
        steps:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string }
        results: { type: object }
